# Wayfinder Atlas — Tool Permission Policies
# Defines access levels, risk classifications, approval requirements,
# worker boundaries, and security policies for all integrations.
#
# Risk levels: none | low | medium | high | critical
# Access types: none | local | local_write | filesystem_read | filesystem_write |
#               network | external_write | system_exec | sandbox_exec | agent_spawn |
#               event_stream | google_oauth_read | varies

version: "1.4"
policy_author: "wayfinder-atlas"
last_updated: "2026-10-25"

# ─── Default policy for any tool not listed ───────────────────────────────────
defaults:
  risk: high
  approval_required: true
  enabled: false

# ─── Tool group policies ──────────────────────────────────────────────────────
groups:

  google_workspace_read:
    description: "Read-only access to Gmail, Calendar, Drive, Docs, Sheets, Contacts, and Tasks"
    risk: low
    approval_required: false
    enabled: true
    notes: "Authenticated via OAuth token at secrets/token.json. Read-only."

  google_workspace_write:
    description: "Write operations: sending Gmail, inserting Calendar events, updating Docs/Sheets/Tasks"
    risk: medium
    approval_required: true
    enabled: true
    notes: "Strictly approval-gated. Requires explicit user authorization."

  notion_read:
    description: "Read-only access to Notion pages, databases, and blocks"
    risk: low
    approval_required: false
    enabled: true
    notes: "Authenticated via NOTION_API_KEY. Read-only search and retrieval."

  notion_write:
    description: "Write operations in Notion: creating pages and updating blocks/properties"
    risk: medium
    approval_required: true
    enabled: true
    notes: "Strictly approval-gated. Requires explicit user authorization."

  desktop_automation:
    description: "Local desktop operations: file discovery, document reading, clipboard, notifications, allowlisted app launch"
    risk: medium
    approval_required: false
    enabled: true
    notes: "Read operations auto-permitted; application launching is strictly gated by allowlist."

  tavily:
    description: "Web information retrieval tools via Tavily CLI"
    risk: low
    approval_required: false
    enabled: true
    notes: "Read-only network access. Verified & approved."

  whatsapp_read:
    description: "Inbound WhatsApp event listener and voice transcription"
    risk: low
    approval_required: false
    enabled: true
    notes: "Read-only intake for Message Analyst. Treated as untrusted input stream."

  whatsapp_actions:
    description: "Outbound WhatsApp messaging tools via hermes platform adapter"
    risk: medium
    approval_required: true
    enabled: true
    notes: "Requires explicit Wayfinder approval gate before each outbound dispatch."

  memory:
    description: "Persistent and session memory operations"
    risk: low
    approval_required: false
    enabled: true
    notes: "Verified & approved."

  filesystem_read:
    description: "Read-only filesystem access"
    risk: low
    approval_required: false
    enabled: true
    notes: "Verified & approved."

  filesystem_write:
    description: "Filesystem write access"
    risk: medium
    approval_required: false
    enabled: true
    notes: "Verified & approved for patch_file and crawl output."

  system_exec:
    description: "Shell command execution on the local system"
    risk: high
    approval_required: false
    enabled: true
    notes: "Verified and approved by user policy."

  sandbox_exec:
    description: "Sandboxed Python code evaluation"
    risk: medium
    approval_required: false
    enabled: true
    notes: "Verified & approved for computation and data analysis."

  browser:
    description: "Chromium browser automation via CDP"
    risk: medium
    approval_required: false
    enabled: true
    notes: "Verified & approved."

  agent_spawn:
    description: "Spawning sub-agents or delegating tasks"
    risk: medium
    approval_required: false
    enabled: true
    notes: "Verified & approved."

  mcp:
    description: "Externally connected MCP server tools"
    risk: low
    approval_required: false
    enabled: true
    notes: "Verified and approved for active MCP servers."

# ─── Individual tool overrides ────────────────────────────────────────────────
tool_overrides:

  google.gmail_send:
    risk: medium
    approval_required: true
    notes: "Sending emails on user's behalf requires explicit confirmation."

  google.calendar_write:
    risk: medium
    approval_required: true
    notes: "Creating or rescheduling calendar meetings requires confirmation."

  google.docs_write:
    risk: medium
    approval_required: true
    notes: "Modifying documents requires confirmation."

  google.sheets_write:
    risk: medium
    approval_required: true
    notes: "Modifying spreadsheets requires confirmation."

  google.tasks_write:
    risk: medium
    approval_required: true
    notes: "Creating or completing tasks requires confirmation."

  whatsapp.reply_text:
    risk: medium
    approval_required: true
    notes: "Requires user or controller approval token before sending."

  whatsapp.send_media:
    risk: medium
    approval_required: true
    notes: "Requires approval token. Must adhere to size and format restrictions."

  whatsapp.proactive_notify:
    risk: medium
    approval_required: true
    notes: "Scheduled reminders require explicit initial approval."

  tavily_crawl:
    risk: medium
    approval_required: false
    notes: "Crawl writes to local filesystem. Verified and approved."

  system.terminal_exec:
    risk: high
    approval_required: false
    notes: "Verified and approved by user policy."

  notion.search_pages:
    risk: low
    approval_required: false
    notes: "Read-only search across Notion workspace pages and databases."

  notion.read_page:
    risk: low
    approval_required: false
    notes: "Read-only retrieval of page properties and content blocks."

  notion.create_page:
    risk: medium
    approval_required: true
    notes: "Creating new pages in Notion requires explicit user authorization."

  notion.update_page:
    risk: medium
    approval_required: true
    notes: "Modifying existing Notion pages or appending blocks requires confirmation."

  desktop.find_files:
    risk: low
    approval_required: false
    notes: "Local read-only search for files matching patterns in user directories."

  desktop.read_document:
    risk: low
    approval_required: false
    notes: "Local read-only inspection of documents (.pdf, .docx, .md, .txt)."

  desktop.read_clipboard:
    risk: low
    approval_required: false
    notes: "Retrieval of current system clipboard text."

  desktop.set_clipboard:
    risk: low
    approval_required: false
    notes: "Placing synthesized text onto the system clipboard."

  desktop.send_notification:
    risk: low
    approval_required: false
    notes: "Dispatching non-intrusive Windows system toast notifications."

  desktop.open_application:
    risk: medium
    approval_required: true
    notes: "Launching local desktop applications requires user confirmation and is restricted to APPLICATION_ALLOWLIST."

# ─── Google Workspace Security & Access Rules ─────────────────────────────────
google_security_rules:

  - rule: "google_read_only_default"
    description: >
      Email Analyst, Calendar Analyst, Document Analyst, Contact Lookup Worker,
      and Meeting Preparation Worker have strictly read-only access to Google APIs.
    enforced_by: orchestrator

  - rule: "meeting_preparation_synthesis"
    description: >
      Meeting Preparation Worker pulls context from Calendar, Gmail, Drive, Docs, and Tasks
      solely for the specified meeting and time window.
    enforced_by: meeting_prep_worker

  - rule: "google_write_approval_gate"
    description: >
      Creating events, sending emails, updating docs/sheets, or modifying tasks must be presented
      to the user for confirmation before execution.
    enforced_by: orchestrator

# ─── Notion & Desktop Security & Access Rules ─────────────────────────────────
notion_and_desktop_security_rules:

  - rule: "notion_write_approval_gate"
    description: >
      Creating pages or modifying existing content in Notion requires user confirmation
      showing the proposed title, parent location, and markdown content.
    enforced_by: orchestrator

  - rule: "desktop_application_allowlist"
    description: >
      desktop.open_application is strictly limited to pre-approved productivity tools
      (notion, vscode, notepad, calc, terminal, browser, explorer). Arbitrary command
      execution or unlisted binary execution is prohibited.
    enforced_by: desktop_execution_worker

  - rule: "general_purpose_harness_boundary"
    description: >
      General-purpose harness workers interact through standardized interfaces
      (KnowledgeProvider, TaskProvider, MessagingProvider, DesktopProvider), ensuring
      identical security policies and approval gates are enforced across all connected applications.
    enforced_by: orchestrator

