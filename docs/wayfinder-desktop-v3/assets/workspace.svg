<text x="405" y="521" font-size="13" fill="#bcb0da" font-weight="600">Suggested focus</text>
<text x="406" y="550" font-size="15" fill="#e4e5ef" font-weight="400">08:30 – 10:00    Work on your most important task</text>
<text x="406" y="582" font-size="15" fill="#e4e5ef" font-weight="400">11:00 – 11:30    Project review</text>
<text x="386" y="653" font-size="15" fill="#e8e8f1" font-weight="600">Why this plan?</text>
<text x="386" y="680" font-size="13" fill="#aeb6c8" font-weight="400">It leaves room around meetings and keeps the overdue item visible.</text>
<text x="386" y="711" font-size="12" fill="#bca4ef" font-weight="400">View sources     Open task list     Save as workflow</text>
<rect x="330" y="758" width="716" height="97" rx="16" fill="#24262f" stroke="#3a3e4b"/>
<text x="349" y="790" font-size="14" fill="#929aad" font-weight="400">Ask a question or describe the next step…</text>
<text x="349" y="829" font-size="12" fill="#b2b9cb" font-weight="400">+ Attach     Cedar memory space</text>
