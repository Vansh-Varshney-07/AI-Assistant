<text x="491" y="266" font-size="15" fill="#e9eaf2" font-weight="400">Help me plan tomorrow using my calendar and tasks.</text>
<text x="491" y="291" font-size="14" fill="#b9bfd0" font-weight="400">Prepare a brief. Keep changes for me to review.</text>
<text x="350" y="357" font-size="17" fill="#d2beff" font-weight="700">W</text>
<text x="386" y="357" font-size="20" fill="#f0edf9" font-weight="600">Here is a draft of your day.</text>
<text x="386" y="391" font-size="14" fill="#b7bfce" font-weight="400">Three events and four open tasks are shown in this example.</text>
<text x="386" y="415" font-size="14" fill="#b7bfce" font-weight="400">The brief explains the priorities and links back to its sources.</text>
<rect x="387" y="438" width="171" height="28" rx="14" fill="#262c35" stroke="none"/>
