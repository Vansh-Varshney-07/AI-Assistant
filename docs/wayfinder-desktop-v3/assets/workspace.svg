<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc"><title id="title">Wayfinder conversation-first desktop concept</title><desc id="desc">A future R4 design with navigation, conversation, composer and a review inspector. All data is synthetic and no account is connected.</desc><g font-family="Segoe UI,Arial,sans-serif">
