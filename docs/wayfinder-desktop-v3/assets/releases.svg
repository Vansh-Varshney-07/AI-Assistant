<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc"><title id="title">Wayfinder cumulative release ladder</title><desc id="desc">Seven proposed usable releases, each preserving and improving earlier features. No new release is implemented by this plan.</desc><g font-family="Segoe UI,Arial,sans-serif">
<rect x="0" y="0" width="1440" height="1100" rx="0" fill="#f0f0f5" stroke="none"/>
<text x="48" y="62" font-size="30" fill="#1b2031" font-weight="700">ONE PRODUCT. SEVEN USABLE RELEASES.</text>
<text x="48" y="96" font-size="18" fill="#626b80" font-weight="400">Add complete capabilities. Refine old ones. Keep every accepted journey working.</text>
<text x="48" y="132" font-size="13" fill="#7a668e" font-weight="400">Proposed release plan · every acceptance check starts Not run</text>
<rect x="45" y="165" width="1350" height="102" rx="13" fill="#ffffff" stroke="#dcdfe8"/>
<rect x="63" y="185" width="70" height="62" rx="12" fill="#302744" stroke="none"/>
<text x="79" y="224" font-size="25" fill="#f2e8ff" font-weight="700">R1</text>
<text x="155" y="207" font-size="20" fill="#252b3c" font-weight="650">Real chat</text>
<text x="155" y="235" font-size="15" fill="#626e84" font-weight="400">Ask Hermes, stop, reopen a conversation.</text>
<text x="779" y="221" font-size="15" fill="#687085" font-weight="400">Gate: actual model response + restart continuity.</text>
<rect x="45" y="285" width="1350" height="102" rx="13" fill="#ffffff" stroke="#dcdfe8"/>
<rect x="63" y="305" width="70" height="62" rx="12" fill="#ebe6f5" stroke="none"/>
<text x="79" y="344" font-size="25" fill="#5b457d" font-weight="700">R2</text>
<text x="155" y="327" font-size="20" fill="#252b3c" font-weight="650">Memory + documents</text>
<text x="155" y="355" font-size="15" fill="#626e84" font-weight="400">Remember, correct and compare selected files.</text>
<text x="779" y="341" font-size="15" fill="#687085" font-weight="400">Gate: scoped receipts + citations + no stale answer.</text>
<rect x="45" y="405" width="1350" height="102" rx="13" fill="#ffffff" stroke="#dcdfe8"/>
<rect x="63" y="425" width="70" height="62" rx="12" fill="#ebe6f5" stroke="none"/>
<text x="79" y="464" font-size="25" fill="#5b457d" font-weight="700">R3</text>
<text x="155" y="447" font-size="20" fill="#252b3c" font-weight="650">Google + tasks</text>
<text x="155" y="475" font-size="15" fill="#626e84" font-weight="400">Read your day and manage reviewed work items.</text>
<text x="779" y="461" font-size="15" fill="#687085" font-weight="400">Gate: real account checks; writes qualified separately.</text>
<rect x="45" y="525" width="1350" height="102" rx="13" fill="#ffffff" stroke="#dcdfe8"/>
<rect x="63" y="545" width="70" height="62" rx="12" fill="#ebe6f5" stroke="none"/>
<text x="79" y="584" font-size="25" fill="#5b457d" font-weight="700">R4</text>
<text x="155" y="567" font-size="20" fill="#252b3c" font-weight="650">Workflows</text>
<text x="155" y="595" font-size="15" fill="#626e84" font-weight="400">Save a step list and run it again.</text>
<text x="779" y="581" font-size="15" fill="#687085" font-weight="400">Gate: validated dependencies + cancellation + recovery.</text>
<rect x="45" y="645" width="1350" height="102" rx="13" fill="#ffffff" stroke="#dcdfe8"/>
<rect x="63" y="665" width="70" height="62" rx="12" fill="#ebe6f5" stroke="none"/>
<text x="79" y="704" font-size="25" fill="#5b457d" font-weight="700">R5</text>
<text x="155" y="687" font-size="20" fill="#252b3c" font-weight="650">Scheduler + quick access</text>
<text x="155" y="715" font-size="15" fill="#626e84" font-weight="400">Schedule an approved brief; use quick chat.</text>
<text x="779" y="701" font-size="15" fill="#687085" font-weight="400">Gate: one occurrence; pause and missed-run behaviour.</text>
<rect x="45" y="765" width="1350" height="102" rx="13" fill="#ffffff" stroke="#dcdfe8"/>
<rect x="63" y="785" width="70" height="62" rx="12" fill="#ebe6f5" stroke="none"/>
<text x="79" y="824" font-size="25" fill="#5b457d" font-weight="700">R6</text>
<text x="155" y="807" font-size="20" fill="#252b3c" font-weight="650">Skills + agent controls</text>
<text x="155" y="835" font-size="15" fill="#626e84" font-weight="400">Inspect, test and version actual capabilities.</text>
<text x="779" y="821" font-size="15" fill="#687085" font-weight="400">Gate: reviewed skill changes; permissions never expand.</text>
<rect x="45" y="885" width="1350" height="102" rx="13" fill="#ffffff" stroke="#dcdfe8"/>
<rect x="63" y="905" width="70" height="62" rx="12" fill="#ebe6f5" stroke="none"/>
<text x="79" y="944" font-size="25" fill="#5b457d" font-weight="700">R7</text>
<text x="155" y="927" font-size="20" fill="#252b3c" font-weight="650">Reviewed advanced actions</text>
<text x="155" y="955" font-size="15" fill="#626e84" font-weight="400">Use qualified coding, messaging and desktop actions.</text>
<text x="779" y="941" font-size="15" fill="#687085" font-weight="400">Gate: exact reviews + verified effects + reconciliation.</text>
<text x="50" y="1049" font-size="15" fill="#515d75" font-weight="400">Always retained: conversation continuity · scope and permissions · honest states · accessible UX · previous acceptance cases</text>
</g></svg>
