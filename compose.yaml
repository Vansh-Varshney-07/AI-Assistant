name: memory-system

services:
  falkordb:
    image: falkordb/falkordb:v4.20.7
    container_name: memory-system-falkordb
    ports:
      - "127.0.0.1:6381:6379"
    environment:
      FALKORDB_DATA_PATH: /data
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE -1"
      BROWSER: "0"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  falkordb_data:
    name: memory_system_falkordb_data
